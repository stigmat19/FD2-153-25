<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>page 2</h1>

    <span id="aaa"></span>

    <script>
        const aaa = document.querySelector('#aaa');
        window.addEventListener('storage', () => {
            const valueFromLocal = localStorage.getItem('blabla')
            aaa.innerHTML = "Что-то поменялось: " + valueFromLocal;

        })
    </script>
</body>

</html>
